name: Deploy

# main 푸시 시 production 배포. environment "production" 에 required reviewers 가
# 설정되어 있어 deploy job 이 reviewer 의 Approve 를 받기 전까지 일시정지.
#
# Vercel 의 main 자동 배포는 비활성 (Settings → Git → Production Branch 를
# 다른 브랜치로 두거나, Ignored Build Step 활용). 이 workflow 가 명시적으로 배포.
#
# workflow_dispatch 로 수동 trigger 도 가능 — 긴급 롤백 시 이전 ref 로 실행.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: '배포할 git ref (예: main, v1.2.0, commit sha)'
        required: false
        default: 'main'

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build & verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npm run type-check

      - name: Unit tests + coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_USE_MSW: ${{ vars.NEXT_PUBLIC_USE_MSW }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://placeholder' }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}

      - name: Bundle size limit
        run: npm run size

  deploy:
    name: Deploy to production
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url || vars.PRODUCTION_URL }}
    steps:
      - name: Trigger Vercel deploy hook
        id: deploy
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK_URL secret 이 비어있음"
            exit 1
          fi
          RESPONSE=$(curl -fsSL -X POST "$DEPLOY_HOOK")
          echo "Vercel 응답: $RESPONSE"
          # 응답에서 deployment URL 추출 (jq 사용 가능 시 정밀화)
          echo "url=${{ vars.PRODUCTION_URL }}" >> "$GITHUB_OUTPUT"
