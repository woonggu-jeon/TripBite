name: CI

on:
  pull_request:
  push:
    branches:
      - dev
# main push 검증은 .github/workflows/deploy.yml 의 build job 이 담당 (중복 방지)

# 같은 ref에 새 push 시 진행 중인 run 취소 (CI 분 절약)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 최소 권한 — 기본 토큰 권한 축소 (dependency-review는 PR 메타 읽기 필요)
permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npm run type-check

      - name: Unit tests + coverage (threshold 게이트)
        run: npm run test:coverage

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:8080' }}

      # === 번들 사이즈 회귀 가드 ===
      - name: Bundle size limit
        run: npm run size

      # === 보안 점검 ===
      - name: Dependency audit (high severity)
        run: npm audit --audit-level=high
        continue-on-error: false

      - name: Dependency Review (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          # 라이선스 화이트리스트 — 카피레프트는 별도 검토 필요
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, CC0-1.0
