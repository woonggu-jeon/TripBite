name: CI

on:
  pull_request:
  push:
    branches:
      # - dev   # TODO: main 생성 후 활성화 (그 전까지 dev = production이라 push 트리거 보류)
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npm run type-check

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:8080' }}

      # === 보안 점검 ===
      - name: Dependency audit (high severity)
        run: npm audit --audit-level=high
        continue-on-error: false

      - name: Dependency Review (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          # 라이선스 화이트리스트 — 카피레프트는 별도 검토 필요
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, CC0-1.0
