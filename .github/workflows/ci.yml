name: CI

# PR 만 trigger — dev push 직접 시 Actions 발동 X.
# main push 시 검증은 .github/workflows/deploy.yml 의 build job 이 담당 (중복 방지).
# 문서 only 변경 시 paths-ignore 로 skip (CI 분 절약).
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.gitignore'
      - 'LICENSE'

# 같은 ref에 새 push 시 진행 중인 run 취소 (CI 분 절약)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 최소 권한 — 기본 토큰 권한 축소 (dependency-review는 PR 메타 읽기 필요)
permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npm run type-check

      - name: Unit tests + coverage (threshold 게이트)
        run: npm run test:coverage

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:8080' }}

      # === Storybook 정적 빌드 (deploy X — build 통과만 검증) ===
      - name: Build Storybook
        run: npm run build-storybook

      # === 번들 사이즈 회귀 가드 ===
      # 이미 위 Build step 에서 .next production artifact 생성됨 → size-limit 만 실행.
      # local 에서는 `npm run size` (build 자동 포함) 권장.
      - name: Bundle size limit
        run: npm run size:ci

      # === 보안 점검 ===
      # 운영 번들에 실제 실리는 production deps 만 게이트(--omit=dev).
      # dev/빌드 툴체인(Storybook·vite 등)의 transitive DoS 취약점은 사용자에게 노출되지
      # 않고 일부는 upstream fix 부재라, 별도 트리아지 대상(릴리스 차단 아님).
      - name: Dependency audit (prod, high severity)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: false

      # dev 취약점은 비차단으로 가시화만(정보용).
      - name: Dependency audit (dev, 정보용)
        run: npm audit --audit-level=high || true
        continue-on-error: true

      # Dependency Graph(리포 Settings → Security) 활성화 시 동작. 미활성 리포에선
      # 액션이 "not supported" 로 실패하므로 비차단(설정 켜면 자동으로 게이트 역할).
      # 취약점 차단은 위 npm audit(prod) 가 담당.
      - name: Dependency Review (PR only)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          # 운영 번들에 실리는 runtime 스코프만 차단(dev/빌드 툴체인은 비차단) — npm audit 와 일관.
          fail-on-scopes: runtime
          # 라이선스 화이트리스트 — 카피레프트는 별도 검토 필요
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, CC0-1.0
