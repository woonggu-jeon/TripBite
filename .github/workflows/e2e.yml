name: E2E

# Playwright E2E — CI 비용이 큰 작업(빌드+브라우저)이라 별도 workflow로 분리.
# MSW 모드로 백엔드 없이 핵심 흐름 검증.
#
# 매트릭스:
#   - PR: desktop-mac + mobile-chrome-aos (chromium 만, 빠른 검증)
#   - main push: 전체 projects (desktop / mobile-chrome / mobile-safari / mobile-pwa)

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_USE_MSW: 'true'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Playwright 브라우저 캐시
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-v2

      # 브라우저 설치 — main 은 chromium + webkit, PR 은 chromium 만 (속도)
      - name: Install Playwright browsers (PR — chromium)
        if: github.event_name == 'pull_request'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright browsers (main — chromium + webkit)
        if: github.event_name == 'push'
        run: npx playwright install --with-deps chromium webkit

      # 테스트 실행 — PR 은 빠른 매트릭스(chromium) / main 은 전체 projects
      # 프로젝트명은 playwright.config.ts 와 일치해야 함(desktop-mac / mobile-chrome-aos).
      #
      # PR 비차단(continue-on-error): 현재 잠복 실패 2종을 트리아지 전까지 머지 차단 방지.
      #   1) visual.spec.ts — baseline 이 darwin/win32 만 커밋됨, CI 는 linux → Linux baseline
      #      생성·커밋 필요(Playwright docker 컨테이너). 2) mock-auth/mobile-360 기능 스펙 ~8건.
      #   → BACKLOG "E2E 트리아지" 참조. baseline·기능 정리 후 continue-on-error 제거.
      - name: Run E2E (PR — desktop-mac + mobile-chrome-aos)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          npm run test:e2e -- \
            --project=desktop-mac \
            --project=mobile-chrome-aos

      - name: Run E2E (main — all 4 projects)
        if: github.event_name == 'push'
        run: npm run test:e2e

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
